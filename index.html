    <div class="pa"></div>

    <div class="input-container">
      <img id="flag" src="/img/eu.png" class="flag" />
      <select id="currencyone" name="country" class="menu">
        <option value="EUR" class="op" selected>Euro</option>
        <option value="USD" class="op">US-Dollar</option>
        <option value="GBP" class="op">Pfund</option>
        <option value="UAH" class="op">Hrywnja</option>
        <option value="THB" class="op">Baht</option>
        <option value="RUB" class="op">Rubel</option>
        <option value="JPY" class="op">Yen</option>
        <option value="NOK" class="op">Kronen</option>
        <option value="INR" class="op">Rupie</option>
        <option value="CHF" class="op">Franken</option>
        <option value="HRK" class="op">K-Kuna</option>
      </select>
      <input value="0" type="text" class="puts" id="amount-one" />
      <span class="währung" id="currency">EUR</span>
    </div>

    <div class="container-center">
      <img src="img/arrows.png" alt="" />
      <div class="swap-rate-container">
        <!--<button class="swap" id="swap">Swap</button>-->
      </div>
    </div>

    <div class="rate" id="rate"></div>

    <div class="input-container">
      <img src="/img/usa.png" id="flagge" class="flag" />
      <select id="currencytwo" class="menu" name="currency">
        <option value="USD" class="op" selected>US-Dollar</option>
        <option value="EUR" class="op">Euro</option>
        <option value="GBP" class="op">Pfund</option>
        <option value="UAH" class="op">Hrywnja</option>
        <option value="THB" class="op">Baht</option>
        <option value="RUB" class="op">Rubel</option>
        <option value="JPY" class="op">Yen</option>
        <option value="NOK" class="op">Kronen</option>
        <option value="INR" class="op">Rupie</option>
        <option value="CHF" class="op">Franken</option>
        <option value="HRK" class="op">K-Kuna</option>
      </select>
      <input
        type="text"
        id="amount-two"
        placeholder="0"
        class="puts"
        disabled
      />
      <span class="währung" id="währung">USD</span>
    </div>

    <div class="container-center">
      <!--<button style="cursor: pointer" onclick="berechnen()">Berechnen</button>-->
    </div>

    <script>
      // Währungen und zugehörige Flaggen in einem Objekt speichern
      var currencyData = {
        EUR: "/img/eu.png",
        USD: "/img/usa.png",
        GBP: "/img/uk.jpg",
        UAH: "/img/ukr.png",
        THB: "/img/thb.png",
        RUB: "/img/rub.png",
        JPY: "/img/JPY.png",
        NOK: "/img/nok.png",
        INR: "/img/inr.png",
        CHF: "/img/swissflag.png",
        HRK: "/img/hrk.png",
      };

      function updateCurrencyAndFlag(
        selectElementId,
        currencyDisplayId,
        flagImgId
      ) {
        var selectElement = document.getElementById(selectElementId);
        var currencyDisplay = document.getElementById(currencyDisplayId);
        var flagImg = document.getElementById(flagImgId);

        selectElement.addEventListener("change", function () {
          var selectedCurrency = selectElement.value;

          // Währungsanzeige aktualisieren
          if (currencyDisplay) {
            currencyDisplay.innerHTML = selectedCurrency;
          }

          // Flaggenbild aktualisieren
          if (flagImg && currencyData[selectedCurrency]) {
            flagImg.src = currencyData[selectedCurrency];
          }
        });
      }

      // Funktionen für beide Select-Elemente aufrufen
      updateCurrencyAndFlag("currencyone", "currency", "flag");
      updateCurrencyAndFlag("currencytwo", "währung", "flagge");
    </script>

    <script src="Javascript/script.js"></script>
    <script src="Javascript/currency.js"></script>
  </body>
